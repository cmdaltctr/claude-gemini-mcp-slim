[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-ai-orchestrator-mcp"
version = "2.0.0"
description = "AI Orchestrator MCP Server for Claude with Gemini API & CLI integration"
authors = [
    {name = "Claude Gemini MCP Team"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["mcp", "gemini", "claude", "ai", "development"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=1.0.0",
    "google-generativeai>=0.8.0",
    "instructor[google-generativeai]>=0.6.0",
    "pydantic>=2.0.0",
]

# ============================================================================
# UV Configuration
# ============================================================================

[tool.hatch.build.targets.wheel]
packages = ["src/claude_gemini_mcp"]

[tool.uv]
# UV-specific settings for faster dependency resolution
preview = true  # Enable preview features
managed = true  # Use uv for managing Python versions and dependencies

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "bandit[toml]>=1.7.0",
    "pip-audit>=2.6.0",
]

[project.urls]
Homepage = "https://github.com/your-org/claude-ai-orchestrator-mcp"
Repository = "https://github.com/your-org/claude-ai-orchestrator-mcp.git"
Documentation = "https://github.com/your-org/claude-ai-orchestrator-mcp#readme"
"Bug Tracker" = "https://github.com/your-org/claude-ai-orchestrator-mcp/issues"

# ============================================================================
# Tool Configuration
# ============================================================================

[tool.pytest.ini_options]
minversion = "7.0"
# Basic configuration - parallel execution controlled by test scripts
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
    "--maxfail=5",            # Stop after 5 failures
    "--tb=short",             # Short traceback format
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
    "unit: marks tests as unit tests",
    "security: marks tests as security-focused tests",
    "performance: marks tests as performance tests",
    "stress: marks tests as stress tests (timing heavy tests)",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "test_*.py",
    "venv/*",
    "env/*",
    ".venv/*",
    "setup.py",
    "*/migrations/*",
    "*/__pycache__/*",
]
branch = true

[tool.coverage.report]
fail_under = 0.0
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
precision = 2

[tool.coverage.html]
directory = "htmlcov"

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.test-env
  | \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | env
  | venv
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["claude_gemini_mcp"]
known_third_party = ["pytest", "mcp", "google"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
skip_gitignore = true
extend_skip_glob = [".test-env/*", "venv/*", "env/*", ".venv/*"]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503", "E501"]
exclude = [
    ".git",
    "__pycache__",
    ".test-env",
    ".venv",
    "venv",
    "env",
    ".tox",
    "dist",
    "build",
    "*.egg-info",
]
per-file-ignores = [
    "__init__.py:F401",
    "tests/*:S101,S602,S603,S607",  # Allow assert, subprocess in tests
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true
exclude = [
    "^\\.venv/",
    "^venv/",
    "^env/",
    "^\\.test-env/",
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv", "env"]
skips = ["B101", "B601", "B602"]  # Skip assert_used, paramiko_calls, subprocess_popen_with_shell_equals_true
confidence_level = "medium"
severity_level = "medium"

[tool.bandit.assert_used]
skips = ["*/test_*.py", "*/tests/*"]

[tool.pip-audit]
desc = "Audit Python packages for known vulnerabilities"
require-hashes = false
output = "json"

[dependency-groups]
dev = [
    "yamllint>=1.37.1",
]
